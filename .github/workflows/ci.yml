name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  harness:
    name: harness (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # herdr is not installed here, so the end-to-end tests skip themselves.
      - run: bun test ./test/

  dori-mode:
    name: dori-mode (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/dori-mode/scripts
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p .
      - run: bun test
